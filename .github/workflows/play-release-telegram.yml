name: Play release Telegram notification

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: play-release-telegram
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.ahmadss.balokkosong
  PLAY_TRACK: alpha
  TARGET_BUILD: '10'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Play
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Read release status
        id: release
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}/tracks/${PLAY_TRACK}/releases")"

          state="$(jq -r --argjson build "${TARGET_BUILD}" '
            [
              .releases[]?
              | select(any(.activeArtifacts[]?; .versionCode == $build))
              | .releaseLifecycleState
            ][0] // "NOT_FOUND"
          ' <<<"${response}")"

          echo "state=${state}" >>"${GITHUB_OUTPUT}"
          echo "Build ${TARGET_BUILD}: ${state}"

      - name: Notify Telegram when available
        if: steps.release.outputs.state == 'RELEASE_LIFECYCLE_STATE_PUBLISHED'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          marker="notifications/play-build-${TARGET_BUILD}-available"
          if git ls-remote --exit-code --tags origin "refs/tags/${marker}" >/dev/null 2>&1; then
            echo "Notification was already sent."
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ BalokKosong Build ${TARGET_BUILD} sudah Available to selected testers. Tester dapat membuka Play Store dan menekan Update." \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${marker}" -m "Telegram notification sent for Play Build ${TARGET_BUILD}"
          git push origin "refs/tags/${marker}"

      - name: Notify Telegram when rejected
        if: steps.release.outputs.state == 'RELEASE_LIFECYCLE_STATE_NOT_APPROVED'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          marker="notifications/play-build-${TARGET_BUILD}-not-approved"
          if git ls-remote --exit-code --tags origin "refs/tags/${marker}" >/dev/null 2>&1; then
            echo "Notification was already sent."
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ BalokKosong Build ${TARGET_BUILD} tidak disetujui Google Play. Silakan periksa Publishing overview." \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${marker}" -m "Telegram rejection notification sent for Play Build ${TARGET_BUILD}"
          git push origin "refs/tags/${marker}"
